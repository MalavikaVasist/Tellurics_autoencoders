# Experiment 1: whole-night telluric *time-series* reconstruction with
#
#   X = T*S  (B, T=73, N=51557)        ->  telluric_pred (B, T, N=51557)
#   metadata (B, T, 3)  per exposure        loss = MSE(T_tell, telluric_pred)
#
# Pipeline (tellurics.models.multiple_frames.predictor.NeuralTelluricPredictor, registry id
# "neural_telluric_predictor"):
#   1. shared 1D-CNN encodes each exposure of X       ->  Z (B, 73, 64)
#   2. MetadataEncoder maps per-exposure metadata to a 16-dim code
#      M_code (B, 73, 16), and TimeEncoder maps time_hours to a 16-dim code;
#      both concatenated with Z (pre_temporal -> d)   ->  tokens (B, 73, 64)
#   3. the temporal Perceiver compresses the 73 exposures into Q=16 latent
#   4. the latent is expanded back to per-exposure codes H_T (B, 73, 64)
#   5. a shared TelluricDecoder (MLP + learned spectral basis) decodes each
#      code to the full 51557-sample telluric transmission
#
# Run:
#   python -m tellurics.scripts.train --config experiments/multiple_frames/experiment.yaml
#
# Contract with tellurics.data.datamodule (must not be changed blindly):
#   metadata_dim        == 3       # pressure, temperature, humidity (per exposure)
#   num_wavelength_bins == 51557   # = transmission.shape[-1] in the night HDF5

# Artefacts (config.yaml, stellar_assignment.csv, logs/, checkpoints/) land here.
run_dir: runs/experiment

# Weights & Biases: project the metrics go to + this run's display title.
wandb:
  project: neural_telluric_predictor
  title: experiment
  mode: offline  # "online" | "offline" | "disabled"

model:
  architecture: neural_telluric_predictor  # ModelArchitecture enum value
  num_wavelength_bins: 51557             # spectral samples N per exposure
  n_frames_per_series: 73                # exposures T per night
  num_queries: 16                        # learned latent tokens Q (temporal)
  spectral_latent_dim: 64                # per-exposure spectral code dim d
  metadata_dim: 3                        # per-exposure metadata width P (B, T, P)
  metadata_enc_dim: 16                   # encoded metadata code width C
  metadata_enc_hidden: null              # metadata MLP hidden (null -> auto)
  time_enc_dim: 16                       # width of the per-exposure time code
  telluric_decoder_hidden: null          # telluric-decoder MLP hidden (null -> 2*d)
  telluric_activation: optical_depth     # T = exp(-softplus(z)) in (0, 1]  (optical_depth | sigmoid | none)
  num_heads: 4                           # number of attention heads in the temporal Perceiver
  dropout: 0.1
  # shared strided 1D-CNN over the 73 exposures of X (one CNN, shared weights)
  x_encoder_channels: [16, 32, 64, 96, 128]
  x_encoder_kernel: 7
  x_encoder_stride: 2
  # independent stellar (S) 1D-CNN (own weights, never shared with X)
  s_encoder_channels: [16, 32, 64]
  s_encoder_kernel: 7
  s_encoder_stride: 2
  encoder_pool_bins: 16                  # adaptive spectral bins per channel
  # Fusion MLP
  fusion_hidden: 0                       # 0 -> num_queries * spectral_latent_dim
  fusion_layers: 2

data:
  # External data root. ${TELLURICS_DATA} is expanded by load_config from the
  # environment (YAML does not expand variables), so this same manifest works
  # on every machine; the paths below are relative to it.
  root: "${TELLURICS_DATA}"
  night_h5: telluric_timeseries/telluric_templates_nights.h5   # built by tests/testing_dataset_reshape.ipynb
  phoenix_dir: phoenix/convolved    # stellar *.fits pool
  stellar_scale: true                    # normalize each stellar spectrum to unit mean flux
  max_nights: 10000                        # subset: first 100 nights only (not a random sample)
  scale_metadata: true                   # metadata  (pressure, temperature, humidity) -> [0,1]
  scale_params: true                     # theta.output_params -> [0,1] (not a training target any more)
  scale_time: true                       # time_hours -> [0,1]  (time_hours / 16)
  param_bounds:
    time_hours: [0.0, 6.0]              # h    
    pressure: [600.0, 850.0]             # hPa
    temperature: [233.15, 318.15]        # K    (-40 .. +45 degC)
    humidity: [0.0, 100.0]               # %
    angle: [0.0, 90.0]                   # deg  (zenith angle)
    airmass: [1.0, 2.0]                  # sec(z), altitude >= 30 deg
    co2: [420.0, 435.0]                  # ppmv
    o3: [0.018, 0.0429]                  # ppmv
    n2o: [0.335, 0.345]                  # ppmv
    co: [0.088, 0.169]                   # ppmv
    ch4: [1.90, 1.98]                    # ppmv
    o2: [205800.0, 214200.0]             # ppmv
    "no": [1.0e-19, 1.2e-19]             # ppmv (log-uniform in the generator; quoted key: bare 'no' is YAML boolean False)
    so2: [9.8e-5, 1.02e-4]               # ppmv
    no2: [2.57e-5, 1.0e-4]               # ppmv
    nh3: [9.8e-5, 1.02e-4]               # ppmv
    hno3: [1.74e-5, 5.6e-4]              # ppmv

  # Night-level split (test = 1 - train - val).
  train_fraction: 0.8
  val_fraction: 0.1
  seed: 42                               # seeds the split + stellar assignment
  pin_memory: true                       # DataLoader pin_memory

training:
  optimizer:
    optimizer_type: adam                 # OptimizerType enum value (adam | sgd)
    learning_rate: 1e-4
    weight_decay: 1e-4
  scheduler:
    scheduler_type: cosine               # SchedulerType enum value
    min_lr: 1e-6
  max_epochs: 100
  precision: 16-mixed                    # use "32" on a CPU-only machine
  gradient_clip_val: 1.0
  accumulate_grad_batches: 4             # accumulate gradients over this many batches before stepping the optimizer
  val_check_interval: 1.0                # epochs (or fraction) between validations
  log_every_n_steps: 10                  # Trainer logging cadence
  log_dir: logs                          # relative to run_dir (W&B local files) 
  batch_size: 4                          # whole nights per batch
  num_workers: 2                         # DataLoader workers
  save_every_n_epochs: 100               # save checkpoints every N epochs (set to max_epochs to save only the final checkpoint)
  monitor_metric: validation_loss        # must match a metric the module logs
  early_stopping_patience: 5
  checkpoint_dir: checkpoints            # relative to run_dir

