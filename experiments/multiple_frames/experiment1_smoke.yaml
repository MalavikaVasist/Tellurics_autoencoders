# Smoke test for experiment1: identical architecture and data contract, but
# trained on a 100-night subset for a few epochs. Use it to check the whole
# pipeline end-to-end (data loading, model forward, loss, checkpointing, W&B
# logging) before committing to the full 4500-night run.
#
# Run:
#   python -m src.tellurics.scripts.train \
    # --config experiments/multiple_frames/experiment1_smoke.yaml \
    # --set training.optimizer.learning_rate=0.001 \
    # --set model.dropout=0.2 \
    # --device gpu
#
# Sizing: data.max_nights: 100 with train_fraction 0.8 / val_fraction 0.1 gives
# 80 train / 10 val / 10 test nights, i.e. 80 / 4 = 20 training batches per
# epoch. The subset is the FIRST 100 nights in the HDF5 (not a random sample).
#
# For a purely local run without W&B uploads: WANDB_MODE=offline.

run_dir: runs/experiment1_smoke

wandb:
  project: neural_telluric_predictor
  title: experiment1_smoke

model:
  architecture: neural_telluric_predictor  # ModelArchitecture enum value
  num_wavelength_bins: 51557             # spectral samples N per exposure
  n_frames_per_series: 73                # exposures T per night
  num_queries: 16                        # learned latent tokens Q (temporal)
  spectral_latent_dim: 64                # per-exposure spectral code dim d
  metadata_dim: 3                        # per-exposure metadata width P (B, T, P)
  use_stellar: true                      # stellar spectrum as an input (needs observed_key: null and no data.real);
                                         # false for observed-flux data / real observations
  metadata_enc_dim: 16                   # encoded metadata code width C
  metadata_enc_hidden: null              # metadata MLP hidden (null -> auto)
  time_enc_dim: 16                       # width of the per-exposure time code
  telluric_decoder_hidden: null          # telluric-decoder MLP hidden (null -> 2*d)
  telluric_activation: optical_depth     # T = exp(-softplus(z)) in (0, 1]  (optical_depth | sigmoid | none)
  num_heads: 4
  dropout: 0.1
  # shared strided 1D-CNN over the 73 exposures of X (one CNN, shared weights)
  x_encoder_channels: [16, 32, 64, 96, 128]
  x_encoder_kernel: 7
  x_encoder_stride: 2
  # independent stellar (S) 1D-CNN (own weights, never shared with X)
  s_encoder_channels: [16, 32, 64]
  s_encoder_kernel: 7
  s_encoder_stride: 2
  encoder_pool_bins: 16                  # adaptive spectral bins per channel
  # Fusion MLP
  fusion_hidden: 0                       # 0 -> num_queries * spectral_latent_dim
  fusion_layers: 2

data:
  root: "${TELLURICS_DATA}"
  night_h5: telluric_timeseries/telluric_templates_nights.h5   # built by tests/testing_dataset_reshape.ipynb
  # HDF5 dataset with the telluric spectra (the target; with observed_key:
  # null also multiplied by the star to build the input)
  target_key: flux
  # Model input of night_h5 (target_key is always the target):
  #   null      -- pure tellurics: every night gets a fixed star from
  #                phoenix_dir and observed = flux * star
  #   "<name>"  -- the observed flux is already in the file under that
  #                dataset name; no stars are loaded, assigned or multiplied
  observed_key: null
  simulated: true                        # night_h5 is simulated -> gets the noise below
  # Gaussian input noise (simulations only), relative to each pixel: every
  # observation draws its level ~ N(mean, std^2), then
  # observed += level * observed * N(0, 1) per pixel.
  noise_level_mean: 0.01                 # 1% noise on average
  noise_level_std: 0.001                 # spread of the level: 10% of the 1%
  # Augmentation: each epoch goes over train and val this many times, each
  # pass with a new noise realization (test once). 1 -> no repeats.
  noise_repeats: 1
  # Real observations: observed flux, no telluric target. Not trained on, not
  # noised; after training the best model predicts their tellurics into
  # <run_dir>/predictions/<name>.h5 (or: train --predict CKPT). Example:
  #   real:
  #     - name: harps_2024
  #       night_h5: real/harps_2024.h5   # observed flux + wavelength + labels
  #       observed_key: observed
  real: []
  phoenix_dir: phoenix/convolved    # stellar *.fits pool
  stellar_scale: true                    # normalize each stellar spectrum to unit mean flux
  metadata_columns: [pressure, temperature, humidity]   # = model.metadata_dim (3)
  scale_metadata: true                   # metadata -> [0,1]
  scale_params: true                     # theta.output_params -> [0,1] (not a training target any more)
  scale_time: true                       # time_hours / 16 -> [0,1]
  param_bounds:
    time_hours: [0.0, 6.0]               # h    
    pressure: [730, 760]      #[738.4222, 749.2171]             # hPa
    temperature: [270, 300]                      #[274.47134, 295.89114]        # K    (-40 .. +45 degC)
    humidity: [0.0, 100.0]                         #[0.00, 87.16126]               # %
    angle: [0.00, 70]                              #[0.00, 59.99975]                   # deg  (zenith angle)
    airmass: [1.0, 2.0]                             #[1.0, 2.0]                  # sec(z), altitude >= 30 deg
    co2: [400, 450] #[411.66553, 443.63666]                  # ppmv
    o3: [1.7e-2, 4.3e-2] #[0.01765363, 0.042818625]                  # ppmv
    n2o: [0.3, 0.37] #[0.3283578, 0.35187393]                  # ppmv
    co: [8e-2, 18e-2] #[0.0862631, 0.17226194]                   # ppmv
    ch4: [1.8, 2.1] #[1.8624077, 2.0195072]                    # ppmv
    o2: [201700, 218500] #[201732.55, 218480.84]             # ppmv
    "no": [1e-19, 1.2e-19] #[1.0780002e-19, 1.1219999e-19]             # ppmv (log-uniform in the generator; quoted key: bare 'no' is YAML boolean False)
    so2: [9.5e-5, 10.5e-5] #[9.60416e-05, 0.000104016624]               # ppmv
    no2: [2.5e-5, 7.0e-5] #[2.5195835e-05, 6.993197e-05]               # ppmv
    nh3: [9.5e-5, 10.5e-5] #[9.604334e-05, 0.00010403935]               # ppmv
    hno3: [1e-5, 50.0e-5] #[1.7083108e-05, 0.0005004667]              # ppmv
  max_nights: 10                        # smoke/debug subset: first 10 nights only
  train_fraction: 0.8                    # -> 80 train nights
  val_fraction: 0.1                      # -> 10 val nights (10 test nights)
  seed: 42                               # seeds the split + stellar assignment
  pin_memory: true                       # DataLoader pin_memory

training:
  optimizer:
    optimizer_type: adam                 # OptimizerType enum value (adam | sgd)
    learning_rate: 1e-4
    weight_decay: 1e-4
  scheduler:
    scheduler_type: cosine               # SchedulerType enum value
    min_lr: 1e-6                         # T_max comes from max_epochs below
  max_epochs: 20                         # smoke test: just a few epochs
  precision: "32"                        # quoted: must be a string (safest for a smoke run)
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1             # no accumulation in the smoke run
  val_check_interval: 1.0                # validate once per epoch
  log_every_n_steps: 2
  log_dir: logs                          # relative to run_dir (W&B local files)
  batch_size: 2                          # whole nights per batch
  num_workers: 2                         # DataLoader workers
  save_every_n_epochs: 1                 # checkpoint every epoch
  monitor_metric: validation_loss        # must match a metric the module logs
  early_stopping_patience: 5
  checkpoint_dir: checkpoints            # relative to run_dir
