# Experiment 4: SpecPT adapted to single full-resolution frames
#
#   observed X = T*S (B, N=2048) -> SpecPT -> telluric_pred (B, N)
#   (spectrum only: SpecPT does not use the metadata or wavelengths)
#   loss = MSE(T_tell, telluric_pred)
#
# Model: tellurics.models.single_frame.specpt.SpecPT
#   SpecPT conv stem (k=41/21/11, stride 2, BN, ReLU, MaxPool) -> token conv (x1)
#   -> 128 tokens -> TransformerEncoder -> TransformerDecoder(tgt=enc, memory=enc)
#   -> per-token linear1/ReLU/linear2 reconstructs 16 samples per token -> (B, N)
#   (see the module docstring for what changed w.r.t. the original SpecPT)
#
# One observation in, one telluric spectrum out. The exposures of all nights
# are pooled into observations; a batch is (B, 2048). Night-level split.
#
# Run:
#   python -m tellurics.scripts.train --config experiments/single_frame/experiment_specpt.yaml

# Artefacts (config.yaml, stellar_assignment.csv, logs/, checkpoints/) land here.
run_dir: runs/specpt

# Weights & Biases: project the metrics go to + this run's display title.
wandb:
  project: neural_telluric_predictor
  title: specpt
  mode: offline  # "online" | "offline" | "disabled"

model:
  architecture: specpt
  num_wavelength_bins: 2048              # spectral samples N
  stem_channels: [64, 128, 256]          # SpecPT conv stem
  stem_kernels: [41, 21, 11]             # SpecPT conv stem (odd)
  token_stride: 1                        # tokens cover 16*1 = 16 samples -> 128 tokens
  d_model: 512                           # SpecPT defaults below
  num_heads: 8
  num_encoder_layers: 3
  num_decoder_layers: 3
  dim_feedforward: 2048
  head_hidden: 512                       # linear1 width of the per-token reconstruction head
  dropout: 0.1
  telluric_activation: optical_depth     # T = exp(-softplus(z)) in (0, 1]  (optical_depth | sigmoid | none)

data:
  # External data root. ${TELLURICS_DATA} is expanded by load_config from the
  # environment (YAML does not expand variables), so this same manifest works
  # on every machine; the paths below are relative to it.
  root: "${TELLURICS_DATA}"
  # The 2048-sample dataset: flux (n_obs, 2048) (flat, one row per
  # observation) or (nights, T, 2048), wavelength (2048,), and labels with
  # series_index (flat layout), airmass and PWV. Stars on the same 2048 grid.
  night_h5: telluric_timeseries/telluric_templates_nights.h5
  # HDF5 dataset with the telluric spectra (the target; with observed_key:
  # null also multiplied by the star to build the input)
  target_key: flux
  # Model input of night_h5 (target_key is always the target):
  #   null      -- pure tellurics: every night gets a fixed star from
  #                phoenix_dir and observed = flux * star
  #   "<name>"  -- the observed flux is already in the file under that
  #                dataset name; no stars are loaded, assigned or multiplied
  observed_key: null
  simulated: true                        # night_h5 is simulated -> gets the noise below
  # Gaussian input noise (simulations only), relative to each pixel: every
  # observation draws its level ~ N(mean, std^2), then
  # observed += level * observed * N(0, 1) per pixel.
  noise_level_mean: 0.01                 # 1% noise on average
  noise_level_std: 0.001                 # spread of the level: 10% of the 1%
  # Augmentation: each epoch goes over train and val this many times, each
  # pass with a new noise realization (test once). 1 -> no repeats.
  noise_repeats: 5
  # Real observations: observed flux, no telluric target. Not trained on, not
  # noised; after training the best model predicts their tellurics into
  # <run_dir>/predictions/<name>.h5 (or: train --predict CKPT). Example:
  #   real:
  #     - name: harps_2024
  #       night_h5: real/harps_2024.h5   # observed flux + wavelength + labels
  #       observed_key: observed
  real: []
  phoenix_dir: phoenix/convolved         # stellar *.fits pool (observed_key: null only)
  stellar_scale: true                    # normalize each stellar spectrum to unit mean flux (observed_key: null only)
  max_nights: 10000                        # subset: first 100 nights only (not a random sample)
  # Metadata fed to the model (order = metadata vector order); must match
  # model.metadata_dim. No time and no telluric parameters are read.
  metadata_columns: [airmass, PWV]
  scale_metadata: true                   # metadata -> [0,1] with the bounds below
  metadata_bounds:
    airmass: [1.0, 2.0]                  # sec(z), altitude >= 30 deg
    PWV: [0.0, 25.0]                     # mm

  # Night-level split (test = 1 - train - val).
  train_fraction: 0.8
  val_fraction: 0.1
  seed: 42                               # seeds the split + stellar assignment
  pin_memory: true                       # DataLoader pin_memory

training:
  optimizer:
    optimizer_type: adam                 # OptimizerType enum value (adam | sgd)
    learning_rate: 1e-4
    weight_decay: 1e-4
  scheduler:
    scheduler_type: cosine               # SchedulerType enum value
    min_lr: 1e-6
  max_epochs: 30                     # one epoch = every training observation x data.noise_repeats
  precision: 16-mixed                    # use "32" on a CPU-only machine
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1             # accumulate gradients over this many batches before stepping the optimizer
  val_check_interval: 1.0                # epochs (or fraction) between validations
  log_every_n_steps: 10                  # Trainer logging cadence
  log_dir: logs                          # relative to run_dir (W&B local files) 
  batch_size: 16                         # observations per batch
  num_workers: 2                         # DataLoader workers
  save_every_n_epochs: 30                # save checkpoints every N epochs (set to max_epochs to save only the final checkpoint)
  monitor_metric: validation_loss        # must match a metric the module logs
  early_stopping_patience: 5
  checkpoint_dir: checkpoints            # relative to run_dir

