# Experiment 3: single-frame transformer autoencoder
#
#   observed X = T*S (B, N=2048)  +  wavelength (B, N)  +  metadata [airmass, pwv] (B, 2)
#     -> transformer AE -> telluric_pred (B, N)
#   loss = MSE(T_tell, telluric_pred)
#
# Model: tellurics.models.single_frame.transformer_autoencoder.TransformerAutoencoder
#   patches of 16 samples (128 tokens) + wavelength positional encoding,
#   + 1 metadata token (airmass, pwv) -> TransformerEncoder
#   -> 16 learned latent queries (bottleneck 16 x 64)
#   -> TransformerDecoder from 128 wavelength-encoded per-patch queries -> Linear -> (B, N)
#
# One observation in, one telluric spectrum out. The exposures of all nights
# are pooled into observations; a batch is (B, 2048). Night-level split.
#
# Run:
#   python -m tellurics.scripts.train --config experiments/single_frame/experiment_transformer_ae.yaml

# Artefacts (config.yaml, stellar_assignment.csv, logs/, checkpoints/) land here.
run_dir: runs/transformer_ae

# Weights & Biases: project the metrics go to + this run's display title.
wandb:
  project: neural_telluric_predictor
  title: transformer_ae
  mode: offline  # "online" | "offline" | "disabled"

model:
  architecture: transformer_autoencoder
  num_wavelength_bins: 2048              # spectral samples N
  patch_size: 16                         # samples per token -> 2048/16 = 128 patch tokens (+1 metadata token)
  wavelength_frequencies: 8              # wavelength positional encoding: sin/cos(2^k pi lambda), k = 0..7
  metadata_dim: 2                        # = len(data.metadata_columns): airmass, pwv -> one metadata token
  metadata_enc_dim: 16                   # MetadataEncoder code, then Linear -> d_model metadata token
  metadata_enc_hidden: null              # MetadataEncoder hidden (null -> auto)
  d_model: 256
  num_heads: 8
  num_encoder_layers: 4
  num_decoder_layers: 4
  dim_feedforward: 1024
  num_latents: 16                        # bottleneck tokens
  latent_dim: 64                         # width of each bottleneck token (code = 16 x 64)
  dropout: 0.1
  telluric_activation: optical_depth     # T = exp(-softplus(z)) in (0, 1]  (optical_depth | sigmoid | none)

data:
  # External data root. ${TELLURICS_DATA} is expanded by load_config from the
  # environment (YAML does not expand variables), so this same manifest works
  # on every machine; the paths below are relative to it.
  root: "${TELLURICS_DATA}"
  # TODO: point these at the 2048-sample dataset. The HDF5 needs
  # transmission (nights, T, 2048), wavelength (2048,) and labels with the
  # airmass + pwv columns; the stellar pool must be on the same 2048 grid.
  night_h5: telluric_timeseries/telluric_templates_nights.h5
  phoenix_dir: phoenix/convolved    # stellar *.fits pool
  stellar_scale: true                    # normalize each stellar spectrum to unit mean flux
  max_nights: 10000                        # subset: first 100 nights only (not a random sample)
  # Metadata fed to the model (order = metadata vector order); needs bounds
  # below and must match model.metadata_dim.
  metadata_columns: [airmass, pwv]
  # No telluric parameters here: no parameter columns are read or required
  # (theta.output_params is empty), and no time column (the per-observation
  # models do not use time).
  target_columns: []
  time_column: null
  scale_metadata: true                   # metadata (airmass, pwv) -> [0,1]
  scale_params: true                     # no effect: target_columns is empty
  scale_time: true                       # no effect: time_column is null
  param_bounds:
    time_hours: [0.0, 6.0]              # h    
    pressure: [600.0, 850.0]             # hPa
    temperature: [233.15, 318.15]        # K    (-40 .. +45 degC)
    humidity: [0.0, 100.0]               # %
    angle: [0.0, 90.0]                   # deg  (zenith angle)
    airmass: [1.0, 2.0]                  # sec(z), altitude >= 30 deg
    pwv: [0.0, 25.0]                     # mm
    co2: [420.0, 435.0]                  # ppmv
    o3: [0.018, 0.0429]                  # ppmv
    n2o: [0.335, 0.345]                  # ppmv
    co: [0.088, 0.169]                   # ppmv
    ch4: [1.90, 1.98]                    # ppmv
    o2: [205800.0, 214200.0]             # ppmv
    "no": [1.0e-19, 1.2e-19]             # ppmv (log-uniform in the generator; quoted key: bare 'no' is YAML boolean False)
    so2: [9.8e-5, 1.02e-4]               # ppmv
    no2: [2.57e-5, 1.0e-4]               # ppmv
    nh3: [9.8e-5, 1.02e-4]               # ppmv
    hno3: [1.74e-5, 5.6e-4]              # ppmv

  # Night-level split (test = 1 - train - val).
  train_fraction: 0.8
  val_fraction: 0.1
  seed: 42                               # seeds the split + stellar assignment
  pin_memory: true                       # DataLoader pin_memory

training:
  optimizer:
    optimizer_type: adam                 # OptimizerType enum value (adam | sgd)
    learning_rate: 1e-4
    weight_decay: 1e-4
  scheduler:
    scheduler_type: cosine               # SchedulerType enum value
    min_lr: 1e-6
  max_epochs: 30                     # one epoch = every observation (exposure) of every training night
  precision: 16-mixed                    # use "32" on a CPU-only machine
  gradient_clip_val: 1.0
  accumulate_grad_batches: 1             # accumulate gradients over this many batches before stepping the optimizer
  val_check_interval: 1.0                # epochs (or fraction) between validations
  log_every_n_steps: 10                  # Trainer logging cadence
  log_dir: logs                          # relative to run_dir (W&B local files) 
  batch_size: 32                         # observations per batch
  num_workers: 2                         # DataLoader workers
  save_every_n_epochs: 30                # save checkpoints every N epochs (set to max_epochs to save only the final checkpoint)
  monitor_metric: validation_loss        # must match a metric the module logs
  early_stopping_patience: 5
  checkpoint_dir: checkpoints            # relative to run_dir

